<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-label="A shiba plush talking while a local LLM and TTS take turns on one 8 GB GPU">
  <style>
    text { font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; }
    .muted { fill: #8b949e; font-size: 16px; }
    .big { fill: #e6edf3; font-size: 20px; font-weight: 600; }
    .grow { transform-box: fill-box; transform-origin: center; }
    .eye { animation: blink 4.2s infinite; }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } }
    .tongue { animation: talk 0.5s infinite alternate ease-in-out; }
    @keyframes talk { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
    .tail { transform-box: fill-box; transform-origin: 70% 100%; animation: wag 0.9s infinite alternate ease-in-out; }
    @keyframes wag { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
    .ear { transform-box: fill-box; transform-origin: 50% 100%; animation: twitch 5s infinite; }
    @keyframes twitch { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(9deg); } 88% { transform: rotate(-3deg); } }
    .breath { transform-box: fill-box; transform-origin: 50% 100%; animation: breath 3.2s infinite ease-in-out; }
    .breath.slow { animation-duration: 5s; }
    @keyframes breath { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.03); } }
    .sw { opacity: 0; animation: sw 1.2s infinite; }
    .sw2 { animation-delay: 0.3s; }
    @keyframes sw { 0% { opacity: 0; } 30% { opacity: 1; } 70%, 100% { opacity: 0; } }
    .z { opacity: 0; animation: z 3s infinite; animation-delay: -1.2s; }
    .z2 { animation-delay: -2.2s; }
    .z3 { animation-delay: -0.2s; }
    @keyframes z { 0% { opacity: 0; transform: translateY(6px); } 30%, 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
    .llm { animation: llm 2.4s infinite; }
    .tts { animation: tts 2.4s infinite; }
    @keyframes llm { 0%, 42% { opacity: 1; } 50%, 92% { opacity: 0.35; } 100% { opacity: 1; } }
    @keyframes tts { 0%, 42% { opacity: 0.35; } 50%, 92% { opacity: 1; } 100% { opacity: 0.35; } }
    .bar { animation: wave 1s infinite alternate ease-in-out; }
    @keyframes wave { from { transform: scaleY(0.15); } to { transform: scaleY(1); } }
    .say { opacity: 0; animation: say 9s infinite; animation-delay: -1s; }
    .say2 { animation-delay: 2s; }
    .say3 { animation-delay: 5s; }
    @keyframes say { 0% { opacity: 0; } 4%, 30% { opacity: 1; } 34%, 100% { opacity: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="859" height="249" rx="16" fill="#0d1117" stroke="#30363d"/>

  <!-- moon, phase of 2026-10-23 (age 11.7 days) -->
  <circle cx="58" cy="54" r="20" fill="#fbefc0" opacity="0.15"/>
  <path d="M58 34 A20 20 0 0 1 58 74 A16.00 20 0 0 1 58 34 Z" fill="#fbefc0"/>

  <ellipse cx="134" cy="192" rx="92" ry="7" fill="#000000" opacity="0.35"/>
  <g class="tail">
    <circle cx="66" cy="112" r="17" fill="#e9a15b" stroke="#2b1d14" stroke-linejoin="round" stroke-linecap="round" stroke-width="3"/>
    <circle cx="68" cy="110" r="7" fill="#fff1dc"/>
  </g>
  <g class="breath">
    <rect x="40" y="112" width="160" height="76" rx="38" fill="#e9a15b" stroke="#2b1d14" stroke-linejoin="round" stroke-linecap="round" stroke-width="3"/>
    <rect x="66" y="160" width="104" height="24" rx="12" fill="#fff1dc"/>
  </g>
  <ellipse cx="146" cy="186" rx="13" ry="7" fill="#fff1dc" stroke="#2b1d14" stroke-linejoin="round" stroke-linecap="round" stroke-width="3"/>
  <ellipse cx="174" cy="186" rx="13" ry="7" fill="#fff1dc" stroke="#2b1d14" stroke-linejoin="round" stroke-linecap="round" stroke-width="3"/>
  <g class="ear">
    <path d="M146 80 L153 42 L178 66 Z" fill="#e9a15b" stroke="#2b1d14" stroke-linejoin="round" stroke-linecap="round" stroke-width="3"/>
    <path d="M153 70 L156 52 L168 64 Z" fill="#fff1dc"/>
  </g>
  <path d="M186 66 L211 42 L216 80 Z" fill="#e9a15b" stroke="#2b1d14" stroke-linejoin="round" stroke-linecap="round" stroke-width="3"/>
  <path d="M196 64 L208 52 L210 70 Z" fill="#fff1dc"/>
  <circle cx="181" cy="104" r="44" fill="#e9a15b" stroke="#2b1d14" stroke-linejoin="round" stroke-linecap="round" stroke-width="3"/>
  <ellipse cx="183" cy="122" rx="33" ry="22" fill="#fff1dc"/>
  <ellipse cx="166" cy="84" rx="5" ry="3.5" fill="#fff1dc"/>
  <ellipse cx="198" cy="84" rx="5" ry="3.5" fill="#fff1dc"/>
  <ellipse class="eye grow" cx="166" cy="99" rx="5" ry="5.5" fill="#2b1d14"/>
  <ellipse class="eye grow" cx="198" cy="99" rx="5" ry="5.5" fill="#2b1d14"/>
  <ellipse cx="155" cy="117" rx="7" ry="4" fill="#f28b82" opacity="0.5"/>
  <ellipse cx="210" cy="117" rx="7" ry="4" fill="#f28b82" opacity="0.5"/>
  <ellipse cx="182" cy="112" rx="5.5" ry="3.8" fill="#2b1d14"/>
  <ellipse class="tongue" cx="182" cy="125" rx="5" ry="4.5" fill="#e0533d" style="transform-box:fill-box;transform-origin:50% 0%"/>
  <path d="M175 118 Q178.5 123 182 118 Q185.5 123 189 118" fill="none" stroke="#2b1d14" stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5"/>
  <g fill="none" stroke="#c9d1d9" stroke-width="2.5" stroke-linecap="round">
    <path class="sw" d="M232 104 Q238 114 232 124"/>
    <path class="sw sw2" d="M241 98 Q250 114 241 130"/>
  </g>
  <text class="say" x="130" y="228" text-anchor="middle" fill="#c9d1d9" font-size="18">おはよう！</text>
  <text class="say say2" x="130" y="228" text-anchor="middle" fill="#c9d1d9" font-size="18">お茶、もう一杯どう？</text>
  <text class="say say3" x="130" y="228" text-anchor="middle" fill="#c9d1d9" font-size="18">今日はいい天気だね</text>

  <g transform="translate(276 36)">
    <text class="big" x="0" y="20">8 GB GPU · two models</text>
    <text class="muted" x="5" y="54">LLM 2.8 GB</text>
    <text class="muted" x="114" y="54">TTS 4.0 GB</text>
    <rect x="0" y="62" width="300" height="40" rx="9" fill="#161b22" stroke="#30363d"/>
    <rect class="llm" x="5" y="67" width="105" height="30" rx="6" fill="#58a6ff"/>
    <rect class="tts" x="114" y="67" width="150" height="30" rx="6" fill="#f0b429"/>
    <text class="muted" x="0" y="132">take turns, one sentence at a time</text>
  </g>

  <g transform="translate(612 104)">
    <g fill="#3fb950">
      <rect class="bar grow" x="0" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.9s;animation-delay:-0.1s"/>
      <rect class="bar grow" x="8" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.7s;animation-delay:-0.5s"/>
      <rect class="bar grow" x="16" y="-30" width="5" height="60" rx="2.5" style="animation-duration:1.1s;animation-delay:-0.3s"/>
      <rect class="bar grow" x="24" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.8s;animation-delay:-0.7s"/>
      <rect class="bar grow" x="32" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.6s;animation-delay:-0.2s"/>
      <rect class="bar grow" x="40" y="-30" width="5" height="60" rx="2.5" style="animation-duration:1s;animation-delay:-0.9s"/>
      <rect class="bar grow" x="48" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.75s;animation-delay:-0.4s"/>
      <rect class="bar grow" x="56" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.95s;animation-delay:-0.6s"/>
      <rect class="bar grow" x="64" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.65s;animation-delay:-0.15s"/>
      <rect class="bar grow" x="72" y="-30" width="5" height="60" rx="2.5" style="animation-duration:1.15s;animation-delay:-0.8s"/>
      <rect class="bar grow" x="80" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.85s;animation-delay:-0.35s"/>
      <rect class="bar grow" x="88" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.7s;animation-delay:-0.55s"/>
      <rect class="bar grow" x="96" y="-30" width="5" height="60" rx="2.5" style="animation-duration:1.05s;animation-delay:-0.25s"/>
      <rect class="bar grow" x="104" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.8s;animation-delay:-0.65s"/>
      <rect class="bar grow" x="112" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.6s;animation-delay:-0.45s"/>
      <rect class="bar grow" x="120" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.95s;animation-delay:-0.05s"/>
      <rect class="bar grow" x="128" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.75s;animation-delay:-0.85s"/>
      <rect class="bar grow" x="136" y="-30" width="5" height="60" rx="2.5" style="animation-duration:1.1s;animation-delay:-0.3s"/>
      <rect class="bar grow" x="144" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.7s;animation-delay:-0.6s"/>
      <rect class="bar grow" x="152" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.9s;animation-delay:-0.2s"/>
      <rect class="bar grow" x="160" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.65s;animation-delay:-0.75s"/>
      <rect class="bar grow" x="168" y="-30" width="5" height="60" rx="2.5" style="animation-duration:1s;animation-delay:-0.4s"/>
      <rect class="bar grow" x="176" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.8s;animation-delay:-0.1s"/>
      <rect class="bar grow" x="184" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.7s;animation-delay:-0.5s"/>
      <rect class="bar grow" x="192" y="-30" width="5" height="60" rx="2.5" style="animation-duration:1.05s;animation-delay:-0.7s"/>
      <rect class="bar grow" x="200" y="-30" width="5" height="60" rx="2.5" style="animation-duration:0.85s;animation-delay:-0.35s"/>
    </g>
    <text class="muted" x="0" y="60">playback never stops</text>
    <text class="big" x="0" y="88">gaps 4.22 s → 0.17 s</text>
  </g>
</svg>
