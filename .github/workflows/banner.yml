name: banner

on:
  schedule:
    # GitHub delays scheduled runs, often by hours (10-14: the 23:00 run fired at 03:14 JST).
    # Run every hour at an off-peak minute; the script draws from the actual run time and the
    # commit step skips unchanged files, so only sleep/wake and the daily moon produce commits.
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/banner.py
      - name: commit if changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/banner-*.svg
          git diff --cached --quiet || git commit -m "banner: $(TZ=Asia/Tokyo date +'%F %H:%M') JST"
          git push
